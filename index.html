<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Chat — Converse com seus ídolos</title>
    <meta name="description" content="Escolha um artista e converse com a IA que imita sua personalidade única.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── TELA DE SELEÇÃO ── -->
  <div id="selection-screen" class="selection-screen">
    <div class="selection-header">
      <div class="selection-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Artist Chat
      </div>
      <p class="selection-subtitle">Escolha um artista e converse com a personalidade dele</p>
    </div>

    <div class="artists-grid" id="artists-grid">
      <!-- Cards gerados pelo JS -->
    </div>
  </div>

  <!-- ── TELA DE CHAT ── -->
  <div id="chat-screen" class="chat-screen" style="display:none">

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-wrapper">
          <div class="sidebar-avatar" id="sb-avatar"></div>
          <span class="online-dot" id="online-dot"></span>
        </div>
        <div>
          <div class="sidebar-name" id="sb-name"></div>
          <div class="sidebar-role" id="sb-role"></div>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        <button id="iniciarBtn" class="nav-btn nav-btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Iniciar sessão
        </button>
        <button id="limparBtn" class="nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Limpar conversa
        </button>
        <button id="encerrarBtn" class="nav-btn nav-btn--danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Encerrar sessão
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="status-block">
        <span class="status-label">Status</span>
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-label-text">Desconectado</span>
        </div>
      </div>

      <div class="sidebar-quote" id="sb-quote">
        <svg viewBox="0 0 24 24" fill="currentColor" class="quote-icon"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg>
        <p id="sb-quote-text"></p>
      </div>

      <div class="sidebar-footer">
        <button id="changeArtistBtn" class="change-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Trocar artista
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="topbar">
        <div class="topbar-identity">
          <div class="topbar-avatar">
            <div class="topbar-avatar-icon" id="tb-avatar"></div>
            <span class="topbar-status-dot" id="topbar-dot"></span>
          </div>
          <div>
            <div class="topbar-name" id="tb-name"></div>
            <div class="topbar-status" id="topbar-status">Aguardando conexão…</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="msg-counter">
            <span id="msg-count">0</span> msgs
          </div>
        </div>
      </header>

      <div id="chat-box" class="chat-box">
        <div id="welcome-screen" class="welcome-screen">
          <div class="welcome-avatar" id="wc-avatar"></div>
          <h2 class="welcome-title" id="wc-name"></h2>
          <p class="welcome-sub" id="wc-desc"></p>
          <div class="suggestions" id="wc-chips"></div>
        </div>
      </div>

      <div class="typing-wrap" id="typing-wrap" style="display:none">
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-text" id="typing-text">Digitando…</span>
      </div>

      <footer class="input-area">
        <div class="input-row">
          <textarea
            id="message-input"
            placeholder="Escreva sua mensagem… (Enter para enviar)"
            rows="1"
            disabled
          ></textarea>
          <button id="send-button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </footer>
    </main>

  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
